name: Collect İSPARK data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: self-hosted
    timeout-minutes: 10

    defaults:
      run:
        # Windows varsayılan olarak betik çalıştırmayı kapalı tutar (execution policy).
        # Bypass yalnızca bu adımların betikleri için geçerlidir; sistem ayarı değişmez.
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check out data branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: data-repo

      - name: Run collector
        run: |
          dotnet run --project src/ParkingPredictor.Collector --configuration Release -- data-repo/data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit and push data
        working-directory: data-repo
        run: |
          $ErrorActionPreference = "Continue"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "No new data, skipping commit."
            exit 0
          }
          $stamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mmZ")
          git commit --quiet -m "Collect ISPARK data $stamp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
